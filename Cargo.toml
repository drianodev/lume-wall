[workspace]
members = [
    "crates/lumewall-core",
    "crates/lumewall-backend",
    "crates/lumewalld",
    "crates/lumewall-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Adriano <drianodev>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = "4.3"
dirs = "5.0"
